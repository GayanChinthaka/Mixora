name: Build & Publish Release

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Release version name (leave blank to read from app/build.gradle.kts)'
        required: false
        default: ''
      prerelease:
        description: 'Mark this release as pre-release / beta'
        type: boolean
        default: false
      draft:
        description: 'Create as a draft release'
        type: boolean
        default: false

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.version_step.outputs.should_release }}
      version_name: ${{ steps.version_step.outputs.version_name }}
      tag_name: ${{ steps.version_step.outputs.tag_name }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine Release Version
        id: version_step
        run: |
          INPUT_VERSION="${{ inputs.version_name }}"
          
          if [ -n "$INPUT_VERSION" ]; then
            VERSION="$INPUT_VERSION"
            echo "Using manual input version: $VERSION"
          else
            VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts || echo "")
            echo "Extracted version from app/build.gradle.kts: $VERSION"
          fi

          if [ -z "$VERSION" ]; then
            echo "Error: Could not determine version name!"
            exit 1
          fi

          TAG="v$VERSION"
          echo "version_name=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag_name=$TAG" >> "$GITHUB_OUTPUT"
          echo "should_release=true" >> "$GITHUB_OUTPUT"

  build-release:
    needs: check-version
    if: needs.check-version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-cleanup: on-success

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Setup Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            mkdir -p app/keystore
            echo "$KEYSTORE_BASE64" | base64 -d > app/keystore/release.keystore
            echo "Custom release keystore decoded successfully."
          else
            echo "No KEYSTORE_BASE64 secret provided. Gradle will use default signing fallback."
          fi

      - name: Build Release APKs (GMS & FOSS)
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew :app:assembleGmsRelease :app:assembleFossRelease --no-daemon

      - name: Prepare Release Artifacts
        id: prepare_artifacts
        run: |
          VERSION="${{ needs.check-version.outputs.version_name }}"
          mkdir -p release-apks

          # Find and copy all built APKs
          find app/build/outputs/apk -type f -name "*.apk" | while read -r apk_path; do
            filename=$(basename "$apk_path")
            
            # Create friendly names for release assets
            if [[ "$filename" == *"gms-release"* ]]; then
              new_name="Mixora-v${VERSION}-gms.apk"
            elif [[ "$filename" == *"foss-release"* ]]; then
              new_name="Mixora-v${VERSION}-foss.apk"
            else
              new_name="Mixora-v${VERSION}-${filename}"
            fi

            cp "$apk_path" "release-apks/$new_name"
            echo "Copied $apk_path -> release-apks/$new_name"
          done

          # Generate SHA256 checksums
          cd release-apks
          sha256sum *.apk > "checksums-sha256.txt"
          cd ..

      - name: Create GitHub Release & Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.check-version.outputs.tag_name }}
          name: "Mixora ${{ needs.check-version.outputs.tag_name }}"
          draft: ${{ inputs.draft || false }}
          prerelease: ${{ inputs.prerelease || false }}
          generate_release_notes: true
          files: |
            release-apks/*.apk
            release-apks/checksums-sha256.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
